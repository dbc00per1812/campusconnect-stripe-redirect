<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007AFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { color: #007AFF; margin: 0 0 10px 0; }
        p { color: #666; margin: 10px 0; }
        .icon { font-size: 48px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎓</div>
        <div class="spinner"></div>
        <h1>Success!</h1>
        <p>Stripe setup complete.</p>
        <p>Redirecting back to CampusLink...</p>
    </div>
    <script>
        // Immediately redirect to the app
        window.location.href = "campuslink://wallet/onboarding-complete";
        
        // Fallback in case the redirect doesn't work
        setTimeout(function() {
            document.querySelector('.card').innerHTML = 
                '<div class="icon">🎓</div>' +
                '<h1>Almost done!</h1>' +
                '<p>If the app doesn\'t open automatically,<br>please return to CampusLink manually.</p>';
        }, 3000);
    </script>
</body>
</html>
